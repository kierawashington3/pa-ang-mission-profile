<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PA Air National Guard Mission Profile</title>
  <!-- QRCode library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ===== Heading with Air Force symbol ===== */
    .heading-with-logo{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin:0 0 8px 0;
    }
    .af-logo-inline{
      height:20px !important;       /* lock small size */
      width:auto !important;
      max-height:20px !important;
      max-width:none !important;     /* ignore any global img max-width */
      display:inline-block !important;
      object-fit:contain !important;
      flex:0 0 auto !important;
    }
    @media (max-width:420px){
      .af-logo-inline{ height:18px !important; max-height:18px !important; }
    }

    /* ===== Page / quiz styles (your originals, tidied) ===== */
    body{
      font-family: Arial, sans-serif;
      background-color:#f4f4f4;
      margin:0;
      padding:0;
      color:#0d2b56; /* ANG-ish dark blue */
    }
    h1{
      text-align:center;
      margin-top:20px;
      color:#0d2b56;
    }
    .container{
      max-width:800px;
      margin:20px auto;
      background-color:#ffffff;
      padding:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      border-radius:8px;
    }
    .question{ margin-bottom:15px; }
    .question label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
    }
    .question input[type="radio"]{ margin-right:8px; }

    #generate-btn{
      background-color:#0d2b56;
      color:#ffffff;
      border:none;
      padding:12px 20px;
      font-size:16px;
      border-radius:4px;
      cursor:pointer;
    }
    #generate-btn:hover{ background-color:#1c3d7a; }

    /* Mission profile card */
    #mission-card{
      display:none;
      max-width:600px;
      margin:20px auto;
      background-color:#f9f6f2;
      border-radius:8px;
      padding:20px;
      box-shadow:0 0 8px rgba(0,0,0,0.1);
    }
    #mission-card h2{
      margin-top:0;
      font-size:28px;
      color:#0d2b56;
    }

    .profile-header{
      display:flex;
      align-items:center;
      margin-bottom:10px;
    }
    .profile-header img{
      width:100px;
      height:100px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid #0d2b56;
      margin-right:20px;
    }
    .profile-name{
      font-size:24px;
      font-weight:bold;
    }

    .career-path{ margin:10px 0; }
    .career-path strong{
      font-size:18px;
      color:#0d2b56;
    }

    .benefits{ margin:15px 0; }
    .benefits ul{ list-style-type:disc; padding-left:20px; }
    .benefits li{ margin-bottom:6px; }

    .careers{ margin:15px 0; }
    .careers ul{ list-style-type:none; padding-left:0; }
    .careers li{
      margin-bottom:10px;
      border-left:4px solid #0d2b56;
      padding-left:10px;
    }

    .qr-section{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:20px;
      gap:16px;
    }
    .qr-section img{ width:100px; height:100px; }

    .footer-text{
      font-size:18px;
      font-weight:bold;
      color:#ffffff;
      background-color:#0d2b56;
      padding:8px;
      text-align:center;
      border-radius:4px;
    }

    .back-btn{
      background-color:#0d2b56;
      color:#ffffff;
      border:none;
      padding:10px 16px;
      font-size:14px;
      border-radius:4px;
      cursor:pointer;
      margin-top:15px;
    }
    .back-btn:hover{ background-color:#1c3d7a; }

    /* Responsive */
    @media (max-width:600px){
      .profile-header{ flex-direction:column; align-items:flex-start; }
      .profile-header img{ margin-bottom:10px; }
      .qr-section{ flex-direction:column; align-items:flex-start; }
      .qr-section img{ margin-bottom:10px; }
    }
  </style>
</head>

<body>
  <h1>PA Air National Guard Mission Profile Quiz</h1>

  <div class="container" id="quiz-section">
    <p>Answer a few quick questions to discover which career path in the Pennsylvania Air National Guard best matches your interests. Your personalized mission profile card will appear after you submit.</p>

    <form id="quiz-form">
      <!-- Contact / lead fields -->
      <div class="question">
        <label for="name">Your First Name:</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Alex">
      </div>
      <div class="question">
        <label for="lastname">Your Last Name:</label>
        <input type="text" id="lastname" name="lastname" required placeholder="e.g. Smith">
      </div>
      <div class="question">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required placeholder="e.g. alex@example.com">
      </div>
      <div class="question">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required placeholder="e.g. 555-123-4567">
      </div>
      <div class="question">
        <label for="zip">ZIP Code:</label>
        <input type="text" id="zip" name="zip" required placeholder="e.g. 12345" pattern="\d{5}">
      </div>
      <div class="question">
        <label for="grade">Grade Level:</label>
        <select id="grade" name="grade" required>
          <option value="" disabled selected>Select grade level</option>
          <option value="9th">9th Grade</option>
          <option value="10th">10th Grade</option>
          <option value="11th">11th Grade</option>
          <option value="12th">12th Grade</option>
          <option value="College">College/Other</option>
        </select>
      </div>
      <div class="question">
        <label for="photo-input">Upload a photo (optional):</label>
        <input type="file" id="photo-input" accept="image/*">
      </div>

      <div class="question">
        <label>1. Which subject interests you the most?</label>
        <label><input type="radio" name="q1" value="technical" required> Science / Technology</label>
        <label><input type="radio" name="q1" value="aviation"> Aviation / Flight</label>
        <label><input type="radio" name="q1" value="mechanical"> Mechanics / Engineering</label>
        <label><input type="radio" name="q1" value="medical"> Biology / Health</label>
        <label><input type="radio" name="q1" value="administrative"> Communications / Writing</label>
      </div>

      <div class="question">
        <label>2. What environment do you see yourself working in?</label>
        <label><input type="radio" name="q2" value="aviation" required> In the cockpit / on an aircraft</label>
        <label><input type="radio" name="q2" value="mechanical"> In a workshop with tools and equipment</label>
        <label><input type="radio" name="q2" value="technical"> On computers, networks, or electronics</label>
        <label><input type="radio" name="q2" value="medical"> In a clinic helping people</label>
        <label><input type="radio" name="q2" value="administrative"> In an office managing information</label>
      </div>

      <div class="question">
        <label>3. Which activity appeals to you most?</label>
        <label><input type="radio" name="q3" value="mechanical" required> Repairing or maintaining machines</label>
        <label><input type="radio" name="q3" value="technical"> Building software or securing networks</label>
        <label><input type="radio" name="q3" value="medical"> Caring for others and providing aid</label>
        <label><input type="radio" name="q3" value="aviation"> Operating sophisticated aircraft systems</label>
        <label><input type="radio" name="q3" value="administrative"> Planning, organizing, or communicating</label>
      </div>

      <div class="question">
        <label>4. What do you consider your greatest strength?</label>
        <label><input type="radio" name="q4" value="technical" required> Problem solving with technology</label>
        <label><input type="radio" name="q4" value="aviation"> Staying focused under pressure</label>
        <label><input type="radio" name="q4" value="mechanical"> Working with my hands</label>
        <label><input type="radio" name="q4" value="medical"> Empathy and caring for others</label>
        <label><input type="radio" name="q4" value="administrative"> Organizing and coordinating people</label>
      </div>

      <div class="question">
        <label>5. How interested are you in protecting others and enforcing security?</label>
        <label><input type="radio" name="q5" value="security" required> Very interested</label>
        <label><input type="radio" name="q5" value="technical"> Interested in cyber security</label>
        <label><input type="radio" name="q5" value="mechanical"> I prefer equipment security</label>
        <label><input type="radio
